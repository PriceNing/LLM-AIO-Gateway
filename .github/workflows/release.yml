name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish to (e.g. v0.1.1). Tag must already exist on the local checkout."
        required: true
        default: ""

permissions:
  contents: write

env:
  # Pin GitHub-hosted JS actions to Node 24 before June 16, 2026 cutover
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build green package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            artifact: LLM-AIO-Gateway-windows-x86_64
          - target: macos-arm64
            os: macos-14
            artifact: LLM-AIO-Gateway-macos-arm64
          - target: linux
            os: ubuntu-22.04
            artifact: LLM-AIO-Gateway-linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build green package (${{ matrix.target }})
        shell: bash
        run: python tools/dist_tools/scripts/build_standalone.py --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/standalone/*.zip
            dist/standalone/*.tar.gz
          if-no-files-found: error

  release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
    steps:
      - name: Ensure tag is pushed to origin (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" || true
          git push origin "$RELEASE_TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute sha256 for every archive
        run: |
          set -e
          for f in artifacts/**/*.zip artifacts/**/*.tar.gz; do
            [ -f "$f" ] || continue
            sha256sum "$f" | tee "$f.sha256"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.zip.sha256
            artifacts/**/*.tar.gz.sha256

