name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0). Defaults to the tag name."
        required: false
        default: ""

permissions:
  contents: write

env:
  # Pin GitHub-hosted JS actions to Node 24 before June 16, 2026 cutover
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build green package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            artifact: LLM-AIO-Gateway-windows-x86_64
          - target: macos-x86_64
            os: macos-13
            artifact: LLM-AIO-Gateway-macos-x86_64
          - target: macos-arm64
            os: macos-14
            artifact: LLM-AIO-Gateway-macos-arm64
          - target: linux
            os: ubuntu-22.04
            artifact: LLM-AIO-Gateway-linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build green package (${{ matrix.target }})
        shell: bash
        run: python tools/dist_tools/scripts/build_standalone.py --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/standalone/*.zip
          if-no-files-found: error

  release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute sha256 for every archive
        run: |
          set -e
          for f in artifacts/**/*.zip; do
            sha256sum "$f" | tee "$f.sha256"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.zip.sha256
